
spring.application.name=salesforce-crud
server.port=8080

# Salesforce OAuth configuration
salesforce.oauth.authorize-url=https://login.salesforce.com/services/oauth2/authorize
salesforce.oauth.token-url=https://login.salesforce.com/services/oauth2/token

salesforce.oauth.client-id=${SALESFORCE_CLIENT_ID:}
salesforce.oauth.client-secret=${SALESFORCE_CLIENT_SECRET:}
salesforce.oauth.redirect-uri=${SALESFORCE_REDIRECT_URI:http://localhost:8080/api/auth/callback}